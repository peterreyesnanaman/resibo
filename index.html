<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resibo</title>
    <style>
        body {
            margin: 0;
            padding: 2rem 1rem;
            background: white;
            color: black;
            font-family: monospace;
        }

        #receipt {
            width: 48ch;
            margin: 0 auto;
            white-space: pre;
            transform-origin: top center;
        }
    </style>
</head>

<body>
    <main id="receipt">Loading...</main>

    <script>
        fetch("resibo.txt")
            .then(response => response.text())
            .then(text => {
                const receipt = document.getElementById("receipt");
                receipt.textContent = text;
                fitReceipt();
            });

        function fitReceipt() {
            const receipt = document.getElementById("receipt");
            const available = document.body.clientWidth - 32;
            const width = receipt.scrollWidth;

            const scale = Math.min(1, available / width);

            receipt.style.transform = `scale(${scale})`;
        }

        window.addEventListener("resize", fitReceipt);
    </script>
</body>
</html>
