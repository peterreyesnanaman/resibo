<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resibo</title>
    <style>
        body {
            margin: 0;
            padding: 2rem 1rem;
            background: white;
            color: black;
            font-family: monospace;
            white-space: pre-wrap;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
<main id="receipt">Loading...</main>

<script>
fetch("resibo.txt")
    .then(response => response.text())
    .then(text => {
        document.getElementById("receipt").textContent = text;
    });
</script>
</body>
</html>
